# Конфигурация для ESP32 устройства
# Этот файл генерируется автоматически скриптом setup.sh
# Не редактируйте вручную - используйте .env файл для изменения настроек

# Upstream для API устройства (порт 80)
upstream esp32_api {
    server ESP32_IP:ESP32_API_PORT max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream для видеопотока устройства (порт 81)
upstream esp32_stream {
    server ESP32_IP:ESP32_STREAM_PORT max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name DOMAIN_NAME;
    
    # Разрешить доступ для проверки Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Редирект всех остальных запросов на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name DOMAIN_NAME;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;
    
    # SSL конфигурация от Let's Encrypt
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Дополнительные SSL настройки для безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Заголовки для WebXR и безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=*, camera=*, gyroscope=*, magnetometer=*, microphone=*, xr-spatial-tracking=*" always;

    # Логирование
    access_log /var/log/nginx/DEVICE_NAME-access.log detailed;
    error_log /var/log/nginx/DEVICE_NAME-error.log;

    # Основное API - проксирование на ESP32 порт 80
    # Доступно по адресу https://DOMAIN_NAME/
    location / {
        # Проверка доступности устройства
        error_page 502 503 504 = @device_offline;
        
        proxy_pass http://esp32_api;
        
        # Заголовки проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Видеопоток - проксирование на ESP32 порт 81
    # Доступно по адресу https://DOMAIN_NAME/stream
    # ESP32 порт 81 маппится на HTTPS порт 443 под URL /stream
    location /stream {
        # Проверка доступности устройства
        error_page 502 503 504 = @stream_offline;
        
        # Перенаправление на stream порт ESP32 (порт 81)
        proxy_pass http://esp32_stream/;
        
        # Заголовки для streaming
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Отключение буферизации для live stream
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # HTTP/1.1 для streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Увеличенные таймауты для stream
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Заголовки для корректной работы MJPEG
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Обработка недоступности основного API
    location @device_offline {
        default_type text/html;
        return 503 '
        <!DOCTYPE html>
        <html lang="ru">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Устройство недоступно</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 20px;
                }
                .container {
                    text-align: center;
                    padding: 40px;
                    background: rgba(255, 255, 255, 0.1);
                    border-radius: 20px;
                    backdrop-filter: blur(10px);
                    max-width: 600px;
                    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                }
                h1 { 
                    font-size: 3em; 
                    margin-bottom: 20px;
                }
                p { 
                    font-size: 1.2em; 
                    margin: 15px 0; 
                    line-height: 1.6;
                }
                .device-name { 
                    font-weight: bold; 
                    color: #ffd700; 
                    background: rgba(255, 215, 0, 0.2);
                    padding: 2px 8px;
                    border-radius: 5px;
                }
                ul {
                    text-align: left;
                    display: inline-block;
                    margin: 20px 0;
                    padding: 20px 40px;
                    background: rgba(255, 255, 255, 0.1);
                    border-radius: 10px;
                }
                li { 
                    margin: 10px 0; 
                    list-style-type: "⚠️ ";
                }
                .retry { margin-top: 30px; }
                button {
                    background: white;
                    color: #667eea;
                    border: none;
                    padding: 15px 30px;
                    font-size: 1.1em;
                    border-radius: 10px;
                    cursor: pointer;
                    transition: all 0.3s;
                    font-weight: 600;
                    box-shadow: 0 4px 15px 0 rgba(255, 255, 255, 0.3);
                }
                button:hover { 
                    transform: scale(1.05);
                    box-shadow: 0 6px 20px 0 rgba(255, 255, 255, 0.4);
                }
                .countdown {
                    font-size: 0.9em;
                    margin-top: 15px;
                    opacity: 0.9;
                }
                @media (max-width: 600px) {
                    h1 { font-size: 2em; }
                    p { font-size: 1em; }
                    .container { padding: 30px 20px; }
                }
            </style>
            <script>
                let seconds = 10;
                function updateCountdown() {
                    const elem = document.getElementById("countdown");
                    if (elem) {
                        elem.textContent = seconds;
                        if (seconds <= 0) {
                            location.reload();
                        }
                        seconds--;
                    }
                }
                setInterval(updateCountdown, 1000);
            </script>
        </head>
        <body>
            <div class="container">
                <h1>🤖 ⚠️</h1>
                <p>Устройство <span class="device-name">DEVICE_NAME</span> в данный момент недоступно</p>
                <p><strong>Возможные причины:</strong></p>
                <ul>
                    <li>Устройство выключено или не подключено к питанию</li>
                    <li>Отсутствует подключение к сети WiFi</li>
                    <li>Устройство перезагружается</li>
                    <li>Неправильный IP адрес в конфигурации</li>
                </ul>
                <div class="retry">
                    <p class="countdown">Автоматическая попытка переподключения через <span id="countdown">10</span> секунд...</p>
                    <button onclick="location.reload()">🔄 Попробовать сейчас</button>
                </div>
            </div>
        </body>
        </html>
        ';
    }

    # Обработка недоступности видеопотока
    location @stream_offline {
        default_type text/html;
        return 503 '
        <!DOCTYPE html>
        <html lang="ru">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Видеопоток недоступен</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    background: #1a1a1a;
                    color: white;
                    padding: 20px;
                }
                .container {
                    text-align: center;
                    max-width: 600px;
                }
                h1 { 
                    font-size: 2.5em; 
                    margin-bottom: 20px;
                }
                p {
                    font-size: 1.1em;
                    line-height: 1.6;
                    margin: 10px 0;
                }
                .device-name {
                    color: #ffd700;
                    font-weight: bold;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>📹 Видеопоток недоступен</h1>
                <p>Устройство <span class="device-name">DEVICE_NAME</span> не передает видео</p>
                <p>Проверьте подключение камеры и статус устройства</p>
            </div>
        </body>
        </html>
        ';
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
